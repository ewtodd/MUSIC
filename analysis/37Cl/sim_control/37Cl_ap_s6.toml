[gas]
species     = "4He" # Fill gas: 4He, 3He, Ar, CF4, CH4, P10, iC4H10
pressure    = 400.0 # Torr
temperature = 293.0 # K

[beam]
species     = "37Cl" # Use "AEl" notation
energy      = 106.77 # Beam KE at the accelerator (before entrance window) [MeV]
energy_fwhm = 2.149 # Beam energy FWHM at accelerator [MeV]
dedx_scale  = 1.0 # Beam stopping power scale factor

[target]
species  = "4He"
compound = "41K"

[windows.entrance]
# mg/cm^2 areal density; -1 disables
material         = "Ti"
thickness_mg_cm2 = 1.3
dedx_scale       = 1.08367 # 87Rb's calibrated Ti-window loss, 46.9 MeV

[windows.exit]
# mg/cm^2 areal density; -1 disables
material         = "Ti"
thickness_mg_cm2 = 1.3
dedx_scale       = 1.08367 # 87Rb's calibrated Ti-window loss, 46.9 MeV

[windows.degrader]
thickness_um = -1

[detector]
eloss_bins = 555 # Number of bins for y axis
max_eloss  = 10.0 # Max y value [MeV]
strip      = 6 # -1 for unreacted beam
# Per-channel noise as %FWHM of the channel's energy deposit. -1 on a given
# channel disables noise there. Mutually exclusive with a scalar `resolution_fwhm_percent` key
# in [detector].
[detector.resolution_fwhm_percent]
Cathode = 12.0
S0      = 12.0
L1      = 12.0
R1      = 12.0
L2      = 12.0
R2      = 12.0
L3      = 12.0
R3      = 12.0
L4      = 12.0
R4      = 12.0
L5      = 12.0
R5      = 12.0
L6      = 12.0
R6      = 12.0
L7      = 12.0
R7      = 12.0
L8      = 12.0
R8      = 12.0
L9      = 12.0
R9      = 12.0
L10     = 12.0
R10     = 12.0
L11     = 12.0
R11     = 12.0
L12     = 12.0
R12     = 12.0
L13     = 12.0
R13     = 12.0
L14     = 12.0
R14     = 12.0
L15     = 12.0
R15     = 12.0
L16     = 12.0
R16     = 12.0
S17     = 12.0

[physics]
# SRIM, unscaled: the Bragg-peak barometer (runs 100 and 82, 400 and 450
# Torr, per-strip medians) puts the beam peak at strips 12.0 and 9.5 and SRIM
# gives 11.4 and 9.8 with the tails right, where the paper's catima/SRIM mean
# sits a strip deep at 450 Torr and no gas scale fixes both pressures. The
# tables sit beside the run output (srim-cache generates them).
stopping   = "srim"
straggling = true

[reaction]
talys_class = "Ar"

[run]
seed             = 19
events_per_strip = 10000
threads          = 32
wait             = 0
update           = 0
max_time         = 2000.0 # ns
sim_step         = 0.001 # cm
method           = 0
output           = "/home/e-work/MUSIC/analysis/37Cl/sim_root_files/traces_37Cl_ap_s6.root"
file_opt         = "recreate"
print_opt        = 0
